  [     5.690000000000000,     0.000000000000000,     0.000000000000000 ], # a
  [     0.000000000000000,     5.690000000000000,     0.000000000000000 ], # b
  [     0.000000000000000,     0.000000000000000,     5.690000000000000 ], # c
]
