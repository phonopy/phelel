vasp_binary = "vasp_std"
prepend_text = ""
append_text = ""
nodes = 1
walltime = "96:00:00"
scheduler_template = """\
#!/bin/bash
#SBATCH --job-name={job_name}
#SBATCH --nodes={nodes}
#SBATCH --time={walltime}
#SBATCH --output=ci_%j.log

{prepend_text}
{mpirun_command} {vasp_binary}
{append_text}
"""

